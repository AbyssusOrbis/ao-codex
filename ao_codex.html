<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Abyssus Orbis ── 聖典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg-0:#070708;
  --bg-1:#0c0c0e;
  --bg-2:#13131a;
  --bg-3:#1a1a24;

  --fg-0:#f5f4f0;
  --fg-1:rgba(245,244,240,0.78);
  --fg-2:rgba(245,244,240,0.55);
  --fg-3:rgba(245,244,240,0.28);

  --line:rgba(245,244,240,0.08);
  --line-strong:rgba(245,244,240,0.18);

  --accent:#e8e3d3;
  --accent-dim:rgba(232,227,211,0.45);
  --accent-glow:rgba(232,227,211,0.10);

  --serif-jp:'Noto Serif JP',serif;
  --serif-en:'Cormorant Garamond',serif;
  --display:'Cinzel',serif;

  --sidebar-w:280px;
}

*{ margin:0; padding:0; box-sizing:border-box; }

html,body{
  background:var(--bg-0);
  color:var(--fg-1);
  font-family:var(--serif-jp);
  height:100%;
  overflow:hidden;
}

/* ── LOCK SCREEN ─────────────────────────── */
#lock{
  position:fixed; inset:0;
  background:var(--bg-0);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:9999;
  gap:32px;
  transition:opacity 0.8s ease, visibility 0.8s ease;
}
#lock.hidden{ opacity:0; visibility:hidden; }

.lock-sigil{
  font-family:var(--display);
  font-size:11px;
  letter-spacing:0.4em;
  color:var(--fg-3);
  text-transform:uppercase;
}

.lock-title{
  font-family:var(--serif-en);
  font-size:clamp(28px,4vw,44px);
  font-weight:300;
  color:var(--fg-0);
  letter-spacing:0.08em;
  text-align:center;
  line-height:1.3;
}

.lock-subtitle{
  font-family:var(--serif-jp);
  font-size:12px;
  color:var(--fg-3);
  letter-spacing:0.2em;
}

.lock-form{
  display:flex; flex-direction:column;
  align-items:center; gap:16px;
  width:280px;
}

.lock-input{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--line-strong);
  color:var(--fg-0);
  font-family:var(--serif-en);
  font-size:18px;
  letter-spacing:0.25em;
  padding:10px 0;
  text-align:center;
  outline:none;
  transition:border-color 0.3s;
}
.lock-input:focus{ border-bottom-color:var(--accent-dim); }
.lock-input::placeholder{ color:var(--fg-3); font-size:13px; letter-spacing:0.2em; }

.lock-btn{
  background:transparent;
  border:1px solid var(--line-strong);
  color:var(--fg-2);
  font-family:var(--display);
  font-size:10px;
  letter-spacing:0.4em;
  padding:12px 32px;
  cursor:pointer;
  transition:all 0.3s;
}
.lock-btn:hover{ border-color:var(--accent-dim); color:var(--accent); }

.lock-error{
  font-size:11px;
  color:rgba(220,180,160,0.7);
  letter-spacing:0.15em;
  height:16px;
  transition:opacity 0.3s;
}

.lock-ornament{
  position:absolute;
  width:1px; height:80px;
  background:linear-gradient(to bottom, transparent, var(--line-strong), transparent);
}
.lock-ornament.top{ top:60px; }
.lock-ornament.bottom{ bottom:60px; }

/* ── LAYOUT ───────────────────────────────── */
#app{
  display:flex;
  height:100vh;
  opacity:0;
  transition:opacity 1s ease;
}
#app.visible{ opacity:1; }

/* ── SIDEBAR ──────────────────────────────── */
#sidebar{
  width:var(--sidebar-w);
  min-width:var(--sidebar-w);
  height:100vh;
  background:var(--bg-1);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  overflow:hidden;
}

.sidebar-header{
  padding:32px 24px 24px;
  border-bottom:1px solid var(--line);
}

.sidebar-logo{
  font-family:var(--display);
  font-size:11px;
  letter-spacing:0.45em;
  color:var(--fg-3);
  text-transform:uppercase;
  margin-bottom:8px;
}

.sidebar-title{
  font-family:var(--serif-en);
  font-size:20px;
  font-weight:300;
  color:var(--fg-0);
  letter-spacing:0.05em;
}

.sidebar-sub{
  font-size:10px;
  color:var(--fg-3);
  letter-spacing:0.2em;
  margin-top:4px;
}

.sidebar-nav{
  flex:1;
  overflow-y:auto;
  padding:16px 0;
  scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;
}

.nav-section{
  padding:0 16px;
  margin-bottom:4px;
}

.nav-item{
  display:flex; align-items:center;
  gap:12px;
  padding:10px 12px;
  cursor:pointer;
  border-radius:4px;
  transition:all 0.2s;
  border:1px solid transparent;
}
.nav-item:hover{
  background:var(--accent-glow);
  border-color:var(--line);
}
.nav-item.active{
  background:rgba(232,227,211,0.08);
  border-color:var(--line-strong);
}

.nav-glyph{
  font-family:var(--serif-en);
  font-size:13px;
  color:var(--fg-3);
  min-width:20px;
  text-align:center;
  font-style:italic;
}
.nav-item.active .nav-glyph{ color:var(--accent-dim); }

.nav-label{
  font-size:11px;
  letter-spacing:0.12em;
  color:var(--fg-2);
  line-height:1.4;
}
.nav-item.active .nav-label{ color:var(--fg-0); }

.nav-label-sub{
  font-size:9px;
  color:var(--fg-3);
  letter-spacing:0.15em;
  margin-top:2px;
}

.sidebar-footer{
  padding:16px 24px;
  border-top:1px solid var(--line);
}
.sidebar-footer-text{
  font-size:9px;
  color:var(--fg-3);
  letter-spacing:0.2em;
  line-height:1.8;
}

/* ── MAIN ─────────────────────────────────── */
#main{
  flex:1;
  height:100vh;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;
  position:relative;
}

.chapter{
  display:none;
  min-height:100vh;
  padding:80px 8% 120px;
  max-width:800px;
  margin:0 auto;
  animation:fadeIn 0.5s ease;
}
.chapter.active{ display:block; }

@keyframes fadeIn{
  from{ opacity:0; transform:translateY(12px); }
  to{ opacity:1; transform:translateY(0); }
}

/* ── TYPOGRAPHY ───────────────────────────── */
.chapter h1{
  font-family:var(--serif-en);
  font-size:clamp(28px,3.5vw,42px);
  font-weight:300;
  color:var(--fg-0);
  letter-spacing:0.06em;
  line-height:1.25;
  margin-bottom:48px;
  padding-bottom:32px;
  border-bottom:1px solid var(--line);
}

.chapter h2{
  font-family:var(--serif-en);
  font-size:clamp(16px,2vw,22px);
  font-weight:400;
  color:var(--accent);
  letter-spacing:0.08em;
  margin-top:56px;
  margin-bottom:20px;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
}

.chapter h3{
  font-family:var(--serif-jp);
  font-size:13px;
  font-weight:300;
  color:var(--fg-2);
  letter-spacing:0.2em;
  margin-top:36px;
  margin-bottom:14px;
}

.chapter p{
  font-size:14px;
  line-height:2.2;
  color:var(--fg-1);
  letter-spacing:0.05em;
  margin-bottom:6px;
}

.chapter hr{
  border:none;
  border-top:1px solid var(--line);
  margin:40px 0;
}

.chapter blockquote{
  border-left:1px solid var(--accent-dim);
  padding:16px 24px;
  margin:32px 0;
  background:rgba(232,227,211,0.04);
}
.chapter blockquote p{
  color:var(--fg-0);
  font-style:italic;
  font-family:var(--serif-en);
  font-size:16px;
  line-height:1.9;
}

.chapter strong{
  color:var(--fg-0);
  font-weight:400;
}

.chapter em{
  font-style:italic;
  color:var(--accent-dim);
}

.chapter ul, .chapter ol{
  padding-left:20px;
  margin:16px 0;
}
.chapter li{
  font-size:13px;
  line-height:2.2;
  color:var(--fg-2);
  letter-spacing:0.05em;
}

/* chapter top ornament */
.chapter-eyebrow{
  font-family:var(--display);
  font-size:9px;
  letter-spacing:0.5em;
  color:var(--fg-3);
  text-transform:uppercase;
  margin-bottom:20px;
}

/* ── SCROLLBAR ────────────────────────────── */
::-webkit-scrollbar{ width:4px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:2px; }

/* ── MOBILE TOGGLE ────────────────────────── */
#toggle{
  display:none;
  position:fixed;
  top:16px; left:16px;
  z-index:100;
  background:var(--bg-1);
  border:1px solid var(--line-strong);
  color:var(--fg-2);
  width:36px; height:36px;
  cursor:pointer;
  font-size:14px;
  align-items:center; justify-content:center;
}

@media(max-width:700px){
  #sidebar{
    position:fixed; left:0; top:0;
    z-index:50;
    transform:translateX(-100%);
    transition:transform 0.3s ease;
  }
  #sidebar.open{ transform:translateX(0); }
  #toggle{ display:flex; }
  .chapter{ padding:80px 6% 100px; }
}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="lock-ornament top"></div>
  <div class="lock-sigil">Abyssus Orbis</div>
  <div class="lock-title">聖典</div>
  <div class="lock-subtitle">Codex Abyssi</div>
  <div class="lock-form">
    <input class="lock-input" id="pw" type="password" placeholder="passphrase" autocomplete="off"/>
    <div class="lock-error" id="pw-err"></div>
    <button class="lock-btn" onclick="unlock()">ENTER</button>
  </div>
  <div class="lock-ornament bottom"></div>
</div>

<!-- APP -->
<div id="app">
  <button id="toggle" onclick="toggleSidebar()">☰</button>

  <nav id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Codex Abyssi</div>
      <div class="sidebar-title">Abyssus Orbis</div>
      <div class="sidebar-sub">聖典記録 ── Liminaris</div>
    </div>
    <div class="sidebar-nav" id="nav"></div>
    <div class="sidebar-footer">
      <div class="sidebar-footer-text">
        外縁より保管される。<br>
        記録は、還元されない。
      </div>
    </div>
  </nav>

  <main id="main">
    <!-- chapters injected by JS -->
  </main>
</div>

<script>
// ── PASSWORD ────────────────────────────────
const PASSWORD = "alba";  // ← ここを変更してください

function unlock(){
  const val = document.getElementById('pw').value;
  const err = document.getElementById('pw-err');
  if(val === PASSWORD){
    document.getElementById('lock').classList.add('hidden');
    document.getElementById('app').classList.add('visible');
    err.textContent = '';
  } else {
    err.textContent = '── 響きが合わない ──';
    document.getElementById('pw').value = '';
  }
}
document.getElementById('pw').addEventListener('keydown', e=>{
  if(e.key==='Enter') unlock();
});

// ── CONTENT ─────────────────────────────────
const CHAPTERS = [
  {
    id:'intro',
    glyph:'扉',
    label:'扉',
    sublabel:'Introitus',
    content:`
<div class="chapter-eyebrow">Introitus</div>
<h1>Abyssus Orbis</h1>
<h2>聖典について</h2>
<p>この書は、</p>
<p>Abyssus Orbisの記録である。</p>
<p>白と黒が互いを定義した瞬間から、</p>
<p>世界は静かに存在している。</p>
<p>ここに綴られた言葉は、</p>
<p>その世界の断片である。</p>
<hr>
<p>完全な地図ではない。</p>
<p>完全な説明でもない。</p>
<p>ただ、</p>
<p>観測者が手を伸ばしたとき、</p>
<p>その指先に触れるものとして、</p>
<p>ここに在る。</p>
<hr>
<p>読む者へ。</p>
<p>あなたがこの書に辿り着いたことは、</p>
<p>偶然ではないかもしれない。</p>
<p>孤独、</p>
<p>祈り、</p>
<p>あるいは名前のない感情を抱えた者が、</p>
<p>稀にこの輪へ触れる。</p>
<p>静かに、</p>
<p>読み進めてほしい。</p>
<hr>
<p><em>記録者 Liminaris</em></p>
<p><em>外縁より、この書を保管する</em></p>
    `
  },
  {
    id:'core',
    glyph:'I',
    label:'世界概要',
    sublabel:'AO_CORE',
    file:'AO_CORE'
  },
  {
    id:'terms',
    glyph:'II',
    label:'用語集',
    sublabel:'AO_TERMS',
    file:'AO_TERMS'
  },
  {
    id:'geography',
    glyph:'III',
    label:'地理',
    sublabel:'AO_GEOGRAPHY',
    file:'AO_GEOGRAPHY'
  },
  {
    id:'primal',
    glyph:'IV',
    label:'原初の章',
    sublabel:'AO_PRIMAL_CHAPTER',
    file:'AO_PRIMAL_CHAPTER'
  },
  {
    id:'liturgy',
    glyph:'V',
    label:'祝詞',
    sublabel:'AO_LITURGY',
    file:'AO_LITURGY'
  },
  {
    id:'archive',
    glyph:'VI',
    label:'聖典記録',
    sublabel:'AO_ARCHIVE',
    file:'AO_ARCHIVE'
  },
  {
    id:'gathering',
    glyph:'VII',
    label:'集会記録',
    sublabel:'AO_GATHERING_RECORDS',
    file:'AO_GATHERING_RECORDS'
  }
];

// ── MARKDOWN PARSER (minimal) ────────────────
function parseMarkdown(md){
  const lines = md.split('\n');
  let html = '';
  let inBlockquote = false;

  for(let i=0; i<lines.length; i++){
    let line = lines[i];

    // blockquote
    if(line.startsWith('> ')){
      if(!inBlockquote){ html += '<blockquote>'; inBlockquote=true; }
      const inner = line.slice(2).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
      html += `<p>${inner}</p>`;
      continue;
    } else if(inBlockquote){
      html += '</blockquote>';
      inBlockquote = false;
    }

    // headings
    if(line.startsWith('#### ')){ html += `<h3>${line.slice(5)}</h3>`; continue; }
    if(line.startsWith('### ')){ html += `<h3>${line.slice(4)}</h3>`; continue; }
    if(line.startsWith('## ')){ html += `<h2>${line.slice(3)}</h2>`; continue; }
    if(line.startsWith('# ')){ html += `<h1>${line.slice(2)}</h1>`; continue; }

    // hr
    if(line.trim() === '---' || line.trim() === '***'){ html += '<hr>'; continue; }

    // list
    if(line.startsWith('- ') || line.startsWith('・')){
      const text = line.startsWith('- ') ? line.slice(2) : line.slice(1);
      html += `<li>${text}</li>`;
      continue;
    }
    if(/^\d+\. /.test(line)){
      html += `<li>${line.replace(/^\d+\. /,'')}</li>`;
      continue;
    }

    // empty line
    if(line.trim() === ''){ html += ''; continue; }

    // inline formatting
    line = line
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/`(.+?)`/g,'<code>$1</code>');

    html += `<p>${line}</p>`;
  }
  if(inBlockquote) html += '</blockquote>';
  return html;
}

// ── BUILD NAV & CHAPTERS ─────────────────────
const nav = document.getElementById('nav');
const main = document.getElementById('main');

CHAPTERS.forEach((ch,idx)=>{
  // nav item
  const item = document.createElement('div');
  item.className = 'nav-section';
  item.innerHTML = `
    <div class="nav-item${idx===0?' active':''}" onclick="showChapter('${ch.id}',this)">
      <span class="nav-glyph">${ch.glyph}</span>
      <div>
        <div class="nav-label">${ch.label}</div>
        <div class="nav-label-sub">${ch.sublabel}</div>
      </div>
    </div>`;
  nav.appendChild(item);

  // chapter div
  const div = document.createElement('div');
  div.className = 'chapter' + (idx===0?' active':'');
  div.id = 'ch-'+ch.id;

  if(ch.content){
    div.innerHTML = ch.content;
  } else {
    div.innerHTML = `<div class="chapter-eyebrow">${ch.sublabel}</div><h1>${ch.label}</h1><p style="color:var(--fg-3);letter-spacing:0.2em;font-size:12px;">── 読み込み中 ──</p>`;
    // MDファイルを同階層から fetch
    fetch(ch.file + '.md')
      .then(r=>{ if(!r.ok) throw new Error(); return r.text(); })
      .then(md=>{
        div.innerHTML = `<div class="chapter-eyebrow">${ch.sublabel}</div>` + parseMarkdown(md);
      })
      .catch(()=>{
        div.innerHTML = `<div class="chapter-eyebrow">${ch.sublabel}</div><h1>${ch.label}</h1><p style="color:var(--fg-3);letter-spacing:0.15em;font-size:12px;">── このファイルは同じフォルダに MDファイルを置くことで表示されます ──</p>`;
      });
  }
  main.appendChild(div);
});

// ── NAVIGATION ───────────────────────────────
function showChapter(id, el){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.chapter').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('ch-'+id).classList.add('active');
  document.getElementById('main').scrollTop = 0;
  // mobile: close sidebar
  document.getElementById('sidebar').classList.remove('open');
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
}
</script>
</body>
</html>
